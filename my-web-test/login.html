<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <!-- Firebase 설정 -->
  <script src="firebase-config.js"></script>
</head>

<body>
  <h2>회원가입</h2>
  <input id="signup-email" placeholder="이메일">
  <input id="signup-password" type="password" placeholder="비밀번호">
  <button onclick="signup()">회원가입</button>

  <h2>로그인</h2>
  <input id="login-email" placeholder="이메일">
  <input id="login-password" type="password" placeholder="비밀번호">
  <button onclick="login()">로그인</button>

  <script>
    const auth = firebase.auth();

    function signup() {
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;

      auth.createUserWithEmailAndPassword(email, password)
        .then(() => alert("회원가입 완료!"))
        .catch(error => alert(error.message));
    }

    function login() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          alert("로그인 성공!");
          location.href = "page2.html"; // 로그인 후 이동
        })
        .catch(error => alert(error.message));
    }
  </script>

</body>
</html>
